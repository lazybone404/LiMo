[package]
name = "limo"
version = "0.5.2"
description = "LiMo — AI 知识管理系统"
authors = ["lazybone404"]
license = ""
repository = "https://github.com/lazybone404/LiMo"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

# ── PDF 导出（WebView2 PrintToPdf）──
# ⚠️ 这两个版本**必须与 tauri 内部使用的一致**（见 Cargo.lock：tauri 2.11.x → wry 0.55
# → webview2-com 0.38 / windows 0.61）。COM 接口类型不跨 crate 实例：版本不同源时
# `ICoreWebView2` 会变成两个不相干的类型，`.cast()` 直接编译失败。
# 升级 tauri 后若此处编译不过，先核对 Cargo.lock 里这两个 crate 的版本再改这里。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
