[project]
name = "limo-backend"
version = "0.5.0"
description = "LiMo knowledge management system - backend"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # HTTP / 网络
    "httpx>=0.28",
    "requests>=2.28",
    "aiohttp>=3.11",
    # 数据
    "pyyaml>=6.0",
    "pydantic>=2.13",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.12",
    # LLM
    "openai>=2.44",
    "tiktoken>=0.10",
    # 文档引擎（7 种格式）
    # ebooklib 已移除（2026-08-26，AGPL-3.0 → 自研 epub-container 纯标准库替代）
    "markitdown>=0.0.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # 适配器
    "trafilatura>=2.1",
    "youtube-transcript-api>=0.6",
    # ASR 引擎（faster-whisper 已从内置移除，需用户自行安装插件）
    "dashscope>=0.0.1",
    # OCR
    "pillow>=12.0",
    # 视频处理（抽帧走 ffmpeg，帧质量走 PIL+numpy，无需 opencv）
    "numpy>=2.0",
    "yt-dlp>=2025.1",
    "ffmpeg-python>=0.2",
    # 导出
    "pygments>=2.20.0",
    "markdown>=3.10.2",
    # Word 导出（Markdown→HTML→docx）。bs4 此前是传递依赖（markitdown/trafilatura
    # 带入），2026-09-21 起被 app/services/docx_export.py 直接 import → 提为显式依赖
    "beautifulsoup4>=4.12",
    # 其他
    "gmssl>=3.2",
    "duckduckgo-search>=8.1.1",
    # docling 已移除（2026-08-03，依赖 torch ~2GB 无法打包），此处删依赖防 venv 残留拖入打包
    "pypdfium2>=5.12.1",
    "pdfplumber>=0.11.10",
    "xlrd>=2.0.2",
    "resvg-py>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyinstaller>=6.21",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
