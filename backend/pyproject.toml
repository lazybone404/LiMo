[project]
name = "limo-backend"
version = "0.1.0"
description = "LiMo knowledge management system - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "trafilatura>=2.1",
    "pillow>=12.0",
    "openai>=2.44",
    "requests>=2.28",
    "pydantic>=2.13",
    "pytesseract>=0.3",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.12",
    "gmssl>=3.2",
    "pygments>=2.20.0",
    "markdown>=3.10.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
