[project]
name = "limo-backend"
version = "0.5.20"
description = "LiMo knowledge management system - backend"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # HTTP / 网络
    "httpx>=0.28",
    "requests>=2.28",
    "aiohttp>=3.11",
    # 数据
    "pyyaml>=6.0",
    "pydantic>=2.13",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.12",
    # LLM
    "openai>=2.44",
    "tiktoken>=0.10",
    # 文档引擎（7 种格式）
    # ebooklib 已移除（2026-08-26，AGPL-3.0 → 自研 epub-container 纯标准库替代）
    "markitdown>=0.0.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # 适配器
    "trafilatura>=2.1",
    # RSS / Atom / RDF 订阅解析（BSD-2-Clause，纯 Python，无编译扩展）。
    # 不用 xml.etree 手写：五种 feed 变体 + 多种日期格式 + 编码 sniff 全得自己处理，
    # 而那正是这个库存在的理由。⚠️ 打包版要能在 `_internal/` 里 import ——
    # 见 LiMoBackend.spec 的 hiddenimports。
    "feedparser>=6.0",
    # ⚠️ 下界必须 >=1.0：1.x 是破坏性重写（list/fetch 变实例方法、片段变 dataclass、
    # 代理走 proxy_config），代码已按 1.x 适配。曾因 `>=0.6` 松到实际装 1.x 而代码没跟，
    # 字幕路径每次都抛 TypeError 被吞 → 静默回退下载（2026-10-10 修复）
    "youtube-transcript-api>=1.0",
    # ASR 引擎（faster-whisper 已从内置移除，需用户自行安装插件）
    "dashscope>=0.0.1",
    # OCR
    "pillow>=12.0",
    # 视频处理（抽帧走 ffmpeg，帧质量走 PIL+numpy，无需 opencv）
    "numpy>=2.0",
    "yt-dlp>=2025.1",
    "ffmpeg-python>=0.2",
    # 导出
    "pygments>=2.20.0",
    "markdown>=3.10.2",
    # Word 导出（Markdown→HTML→docx）。bs4 此前是传递依赖（markitdown/trafilatura
    # 带入），2026-09-21 起被 app/services/docx_export.py 直接 import → 提为显式依赖
    "beautifulsoup4>=4.12",
    # 其他
    # gmssl 已移除（2026-10-06）：唯一使用方是自研抖音签名模块 abogus（头部声明 GPLv3，
    # 源自 TikTokDownloader）——该路径已整体删除，抖音改走 yt-dlp 通用路径。
    # 详见 docs/ACKNOWLEDGMENTS.md。
    "duckduckgo-search>=8.1.1",
    # docling 已移除（2026-08-03，依赖 torch ~2GB 无法打包），此处删依赖防 venv 残留拖入打包
    "pypdfium2>=5.12.1",
    "pdfplumber>=0.11.10",
    "xlrd>=2.0.2",
    # resvg-py 已移除（2026-10-06）：2026-08-16 切 PIL 自绘后**零 import**，声明残留至今
    # （spec 的 collect_all 早已删，见 LiMoBackend.spec:102）。详见 docs/ACKNOWLEDGMENTS.md。
]

[project.scripts]
# `limo` 命令行（只读）。⚠️ 与 `python -m limo_cli` 是同一条入口（见
# `limo_cli/__main__.py`）——未安装入口点的环境（含 `scripts/check-cli`）走后者。
limo = "limo_cli.cli:main"
# MCP 服务端（stdio）。⚠️ 安装版用户走 `LiMoBackend.exe --mcp`，不需要这条入口点 ——
# 它只给 `pip install -e` 的环境用（与 `limo` 同一条纪律）。
limo-mcp = "limo_cli.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyinstaller>=6.21",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
